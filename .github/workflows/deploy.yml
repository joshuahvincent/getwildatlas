name: Deploy to Cloudflare Pages

# main → production (wildatlasapp.com).
# preview/** → a Cloudflare Pages preview at
#   https://<branch-alias>.wildatlaswebsite.pages.dev
# where the alias is the branch name lowercased with every run of
# non-alphanumerics turned into "-" (preview/my-post → preview-my-post).
# Previews are served with X-Robots-Tag: noindex by Cloudflare.
#
# Only a push to (or manual run on) main may deploy with --branch=main.
# A manual run on any other branch deploys as that branch's preview.
#
# The daily schedule rebuilds main so approved, future-dated blog posts go
# live on their date. Runs on main also refresh the review copy (all
# scheduled/draft posts visible) at https://preview.wildatlaswebsite.pages.dev.

on:
  push:
    branches: [main, "preview/**"]
  # Daily rebuild so approved, future-dated blog posts go live on their date.
  # 13:00 UTC = 6am Pacific during daylight time (5am in winter).
  # Scheduled runs use the default branch (main), so they deploy production.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Pick Pages branch
        id: target
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF" = "refs/heads/main" ]; then
            branch=main
          else
            branch=$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
            # "preview" is the review copy's alias (review-copy job below); never let a branch take it.
            if [ -z "$branch" ] || [ "$branch" = "main" ] || [ "$branch" = "preview" ]; then
              echo "Refusing to deploy non-main ref '$REF_NAME' as '$branch'" >&2
              exit 1
            fi
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - run: npx wrangler pages deploy _site --project-name=wildatlaswebsite --branch="$PAGES_BRANCH"
        env:
          PAGES_BRANCH: ${{ steps.target.outputs.branch }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Summary
        if: steps.target.outputs.branch != 'main'
        env:
          PAGES_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          echo "Preview: https://$PAGES_BRANCH.wildatlaswebsite.pages.dev" >> "$GITHUB_STEP_SUMMARY"

  # Review copy of the site with scheduled/draft posts visible, for Josh's
  # pre-publish review: https://preview.wildatlaswebsite.pages.dev
  # Main only: preview/** branches get their own previews from the job above.
  # Not indexed (X-Robots-Tag + robots.txt), not linked from the live site.
  review-copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          SHOW_HIDDEN_POSTS: "1"

      - name: Block indexing of the preview
        run: |
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > _site/_headers

      - run: npx wrangler pages deploy _site --project-name=wildatlaswebsite --branch=preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
