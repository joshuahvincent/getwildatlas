name = "calendar-social"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# Every 30 min; the handler works out Pacific time itself (DST-proof) and acts
# only in the 06:00 PT preview window and the 17:30 PT publish window.
[triggers]
crons = ["*/30 * * * *"]

[[kv_namespaces]]
binding = "CALENDAR_SOCIAL"
# Create with: npx wrangler kv namespace create CALENDAR_SOCIAL  → paste the id
id = "5afb51fe0ed049db981552a109e70eba"

[vars]
SITE = "https://wildatlasapp.com"
# Fill in after first deploy (shown by `wrangler deploy`), e.g. https://calendar-social.<account>.workers.dev
WORKER_ORIGIN = "https://calendar-social.joshuahv.workers.dev"
# SAFE DEFAULT: builds everything (preview + log), posts nothing. Flip to "0" only for go-live.
DRY_RUN = "0"

# Secrets (npx wrangler secret put <NAME>) — never in the repo:
#   META_PAGE_TOKEN  META_PAGE_ID  IG_USER_ID
#   X_API_KEY  X_API_SECRET  X_ACCESS_TOKEN  X_ACCESS_SECRET
#   KILL_KEY
# Optional (testing only): FORCE_SLUG — post this calendar page regardless of date.
